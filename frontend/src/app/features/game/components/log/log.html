<div class="log-panel">
  <div class="log-header">
    <span>📜 Journal d'exploration</span>
  </div>
  <div #logContainer class="log-content">
    <div *ngFor="let line of logs; let last = last" class="log-item" [class.latest]="last">
      <span class="bullet">›</span>
      <span class="text">{{ line }}</span>
    </div>
  </div>
</div>
