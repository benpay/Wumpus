<div class="controls-panel">
  <div class="control-group movement">
    <div class="dpad-grid">
      <div class="dpad-row">
        <button (click)="emit(Action.MOVE_NORTH)" [disabled]="disabled" class="ctrl-btn dir-btn"
          title="Déplacer vers le Haut (Flèche Haut / W)">
          <span>⬆️</span>
          <span class="btn-label">Haut</span>
        </button>
      </div>

      <div class="dpad-row middle">
        <button (click)="emit(Action.MOVE_WEST)" [disabled]="disabled" class="ctrl-btn dir-btn"
          title="Déplacer vers la Gauche (Flèche Gauche / A)">
          <span>⬅️</span>
          <span class="btn-label">Gauche</span>
        </button>

        <button (click)="emit(Action.MOVE_EAST)" [disabled]="disabled" class="ctrl-btn dir-btn"
          title="Déplacer vers la Droite (Flèche Droite / D)">
          <span>➡️</span>
          <span class="btn-label">Droite</span>
        </button>
      </div>

      <div class="dpad-row">
        <button (click)="emit(Action.MOVE_SOUTH)" [disabled]="disabled" class="ctrl-btn dir-btn"
          title="Déplacer vers le Bas (Flèche Bas / S)">
          <span>⬇️</span>
          <span class="btn-label">Bas</span>
        </button>
      </div>
    </div>
  </div>

  <div class="control-group actions">
    <button (click)="emit(Action.SHOOT)" [disabled]="disabled" class="ctrl-btn shoot"
      title="Tirez une flèche (Espace / F)">
      <span>🏹</span>
      <span class="btn-label">Tirer flèche</span>
    </button>

    <button (click)="emit(Action.EXIT)" [disabled]="disabled" class="ctrl-btn exit" title="Quittez la grotte (E)">
      <span>🚪</span>
      <span class="btn-label">Quitter grotte</span>
    </button>
  </div>
</div>
